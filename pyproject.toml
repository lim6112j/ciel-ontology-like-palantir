[project]
name = "ontology-runtime"
version = "0.1.0"
description = "Palantir-style ontology runtime for a Korean liquor wholesale business"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "faker>=33.0",
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "psycopg[binary]>=3.3.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
ontology = "ontology_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# Live tests make real network calls; opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: requires OPENROUTER_API_KEY and makes real network calls",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "ontology"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
    # Imports inside functions are deliberate: the store/action/agent layers
    # reference each other (context <-> store <-> actions) and a module-level
    # import would create cycles.
    "PLC0415",
    # The action service is a dispatcher over rule kinds; branch/return counts
    # are inherent to that job and are covered by tests.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0917",
    # FastAPI's dependency injection is expressed as Depends(...) in defaults.
    "B008",
    # Process-wide engine/session singletons are intentional.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM117", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ontology_runtime"]
mypy_path = "src"
