functions:
  # -- read ---------------------------------------------------------------
  - apiName: computeOrderTotals
    displayName: 발주 금액 계산
    description: 라인 금액과 케이스 수를 합산한다. 세액은 과세 제품 합계의 10%다.
    kind: read
    agentCallable: true
    implementation: ontology_runtime.functions.read.orders.compute_order_totals
    parameters:
      orderLines:
        apiName: orderLines
        type: objectSet
        objectType: SalesOrderLine
        required: true

  - apiName: validateOrderLine
    displayName: 발주라인 검증
    description: 제품 판매 여부와 최소 주문 수량을 확인한다.
    kind: read
    agentCallable: true
    implementation: ontology_runtime.functions.read.orders.validate_order_line
    parameters:
      product:
        apiName: product
        type: objectRef
        objectType: Product
        required: true
      cases:
        apiName: cases
        type: integer
        required: true

  - apiName: findAreaPriceRule
    displayName: 지역별 공급가 조회
    description: 창고 권역과 거래처 업태에 맞는 공급가를 반환한다.
    kind: read
    agentCallable: false
    implementation: ontology_runtime.functions.read.orders.find_area_price_rule
    parameters:
      product:
        apiName: product
        type: objectRef
        objectType: Product
        required: true
      outlet:
        apiName: outlet
        type: objectRef
        objectType: Outlet
        required: true

  - apiName: checkVehicleCapacity
    displayName: 차량 적재 검증
    description: 후보 정류장 집합의 케이스·중량이 차량 한도를 넘지 않는지 확인한다.
    kind: read
    agentCallable: true
    implementation: ontology_runtime.functions.read.delivery.check_vehicle_capacity
    parameters:
      vehicle:
        apiName: vehicle
        type: objectRef
        objectType: Vehicle
        required: true
      stops:
        apiName: stops
        type: objectSet
        objectType: DeliveryStop
        required: true

  - apiName: detectDeliveryExceptions
    displayName: 배송 예외 탐지
    description: 지연·실패 정류장, 용량 초과, 미배정 발주를 결정적으로 찾아낸다.
    kind: read
    agentCallable: true
    implementation: ontology_runtime.functions.read.delivery.detect_delivery_exceptions
    parameters:
      deliveryDate:
        apiName: deliveryDate
        type: date
        required: true
      depot:
        apiName: depot
        type: objectRef
        objectType: Depot
        required: false

  - apiName: driverPerformance
    displayName: 기사 실적
    description: 기간 내 완료 정류장, 정시율, 배송 케이스를 집계한다.
    kind: read
    agentCallable: true
    implementation: ontology_runtime.functions.read.analytics.driver_performance
    parameters:
      from:
        apiName: from
        type: date
        required: true
      to:
        apiName: to
        type: date
        required: true
      driver:
        apiName: driver
        type: objectRef
        objectType: Driver
        required: false

  - apiName: forecastOutletDemand
    displayName: 거래처 수요 예측
    description: 최근 4주 이동평균으로 거래처·제품별 케이스 수요를 추정한다.
    kind: read
    agentCallable: true
    implementation: ontology_runtime.functions.read.analytics.forecast_outlet_demand
    parameters:
      outlet:
        apiName: outlet
        type: objectRef
        objectType: Outlet
        required: true
      weeks:
        apiName: weeks
        type: integer
        required: false

  - apiName: scoreOutletCredit
    displayName: 거래처 신용위험 점수
    description: 최근 주문 패턴과 실패 정류장 비율로 위험 점수를 계산한다.
    kind: read
    agentCallable: true
    implementation: ontology_runtime.functions.read.analytics.score_outlet_credit
    parameters:
      outlet:
        apiName: outlet
        type: objectRef
        objectType: Outlet
        required: true

  # -- write --------------------------------------------------------------
  - apiName: createSalesOrder
    displayName: 발주 생성
    description: 초안 발주와 라인을 만들고 합계를 계산한다.
    kind: write
    implementation: ontology_runtime.functions.write.orders.create_sales_order
    parameters:
      outlet: {apiName: outlet, type: objectRef, objectType: Outlet}
      salesRep: {apiName: salesRep, type: objectRef, objectType: SalesRep, required: false}
      orderDate: {apiName: orderDate, type: date}
      requestedDeliveryDate:
        {apiName: requestedDeliveryDate, type: date, required: false}
      channel: {apiName: channel, type: enum, values: [phone, message, app, agent], required: false}
      lines: {apiName: lines, type: json}
      note: {apiName: note, type: text, required: false}

  - apiName: addOrderLine
    displayName: 발주라인 추가
    description: 초안 발주에 라인을 추가하고 합계를 재계산한다.
    kind: write
    implementation: ontology_runtime.functions.write.orders.add_order_line
    parameters:
      order: {apiName: order, type: objectRef, objectType: SalesOrder}
      product: {apiName: product, type: objectRef, objectType: Product}
      cases: {apiName: cases, type: integer}

  - apiName: removeOrderLine
    displayName: 발주라인 삭제
    description: 초안 발주에서 라인을 제거하고 합계를 재계산한다.
    kind: write
    implementation: ontology_runtime.functions.write.orders.remove_order_line
    parameters:
      line: {apiName: line, type: objectRef, objectType: SalesOrderLine}

  - apiName: startDelivery
    displayName: 배송 시작
    description: 배송을 진행중으로 바꾸고 기사 근무를 기록한다.
    kind: write
    implementation: ontology_runtime.functions.write.delivery_ops.start_delivery
    parameters:
      delivery: {apiName: delivery, type: objectRef, objectType: Delivery}

  - apiName: completeDelivery
    displayName: 배송 완료
    description: 정류장 결과에 따라 완료 또는 부분 완료로 전이한다.
    kind: write
    implementation: ontology_runtime.functions.write.delivery_ops.complete_delivery
    parameters:
      delivery: {apiName: delivery, type: objectRef, objectType: Delivery}

  - apiName: reassignDriver
    displayName: 기사 재배정
    description: 배송의 기사·차량을 교체한다.
    kind: write
    implementation: ontology_runtime.functions.write.delivery_ops.reassign_driver
    parameters:
      delivery: {apiName: delivery, type: objectRef, objectType: Delivery}
      driver: {apiName: driver, type: objectRef, objectType: Driver}
      vehicle: {apiName: vehicle, type: objectRef, objectType: Vehicle, required: false}
      reason: {apiName: reason, type: text, required: false}

  - apiName: reassignStop
    displayName: 정류장 재배차
    description: 정류장을 다른 배송으로 옮기고 순번을 재정렬한다.
    kind: write
    implementation: ontology_runtime.functions.write.delivery_ops.reassign_stop
    parameters:
      stop: {apiName: stop, type: objectRef, objectType: DeliveryStop}
      targetDelivery: {apiName: targetDelivery, type: objectRef, objectType: Delivery}
      sequence: {apiName: sequence, type: integer, required: false}

  - apiName: upsertOutlet
    displayName: 거래처 등록/수정
    description: 거래처를 신규 등록하거나 갱신한다.
    kind: write
    implementation: ontology_runtime.functions.write.master_data.upsert_outlet
    parameters:
      outletNo: {apiName: outletNo, type: string, required: false}
      name: {apiName: name, type: string}
      outletType:
        apiName: outletType
        type: enum
        values: [소매점, 일반음식점, 유흥주점, 편의점, 마트, 실수요자]
      address: {apiName: address, type: string, required: false}
      deliveryWeekday: {apiName: deliveryWeekday, type: integer, required: false}
      depot: {apiName: depot, type: objectRef, objectType: Depot, required: false}
      salesRep: {apiName: salesRep, type: objectRef, objectType: SalesRep, required: false}

  - apiName: upsertDeliveryRoute
    displayName: 배송노선 등록/수정
    description: 요일별 상시 노선을 만들거나 갱신한다.
    kind: write
    implementation: ontology_runtime.functions.write.master_data.upsert_delivery_route
    parameters:
      routeCode: {apiName: routeCode, type: string}
      name: {apiName: name, type: string}
      weekday: {apiName: weekday, type: integer}
      depot: {apiName: depot, type: objectRef, objectType: Depot}
      salesRep: {apiName: salesRep, type: objectRef, objectType: SalesRep, required: false}

  - apiName: planDeliveries
    displayName: 배송 계획 수립
    description: 확정 발주를 요일·창고로 묶어 최근접 순회로 동선을 만들고 배송·정류장을 생성한다.
    kind: write
    implementation: ontology_runtime.functions.write.delivery.plan_deliveries
    parameters:
      deliveryDate:
        apiName: deliveryDate
        type: date
        required: true
      depot:
        apiName: depot
        type: objectRef
        objectType: Depot
        required: true
      maxStopsPerVehicle:
        apiName: maxStopsPerVehicle
        type: integer
        required: false

  - apiName: completeStop
    displayName: 납품 완료 처리
    description: 정류장을 완료하고 판매계산서·계산서 라인을 생성해 발주 상태를 갱신한다.
    kind: write
    implementation: ontology_runtime.functions.write.delivery.complete_stop
    parameters:
      stop:
        apiName: stop
        type: objectRef
        objectType: DeliveryStop
        required: true
      actualCases:
        apiName: actualCases
        type: integer
        required: true
        description: 0이면 전량 미납으로 기록한다.

  - apiName: applyApprovedProposal
    displayName: 승인된 제안 실행
    description: 승인된 ActionProposal의 대상 액션을 동일 적용기로 실행하고 상태를 전이한다.
    kind: write
    implementation: ontology_runtime.functions.write.proposals.apply_approved_proposal
    parameters:
      proposal:
        apiName: proposal
        type: objectRef
        objectType: ActionProposal
        required: true

  - apiName: recordDriverShift
    displayName: 기사 근무 기록
    description: 배송 시작 시 당일 근무를 working으로 생성한다.
    kind: write
    implementation: ontology_runtime.functions.write.delivery_shift.record_driver_shift
    parameters:
      driver:
        apiName: driver
        type: objectRef
        objectType: Driver
        required: true
      shiftDate:
        apiName: shiftDate
        type: date
        required: true
