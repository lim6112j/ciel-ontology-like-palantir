apiName: orderIntakeAgent
displayName: 발주 접수 에이전트
description: 영업사원의 자유 텍스트 발주를 해석해 발주 생성·제출을 제안한다.
kind: intake
systemPromptFile: prompts/order_intake.md
temperature: 0.1
maxTurns: 14
maxTokens: 4096
maxProposals: 3
maxPageSize: 10
allowedActionTypes:
  - CreateSalesOrder
  - SubmitSalesOrder
allowedFunctions:
  - validateOrderLine
  - computeOrderTotals
