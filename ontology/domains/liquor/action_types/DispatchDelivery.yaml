apiName: DispatchDelivery
displayName: 배송 출발 준비
description: 계획된 배송을 출발 준비 상태로 전이한다.
agentProposable: true
allowedRoles: [dispatcher, manager, agent]
parameters:
  delivery:
    apiName: delivery
    type: objectRef
    objectType: Delivery
    displayName: 배송
rules:
  - type: modifyObject
    target: {param: delivery, objectType: Delivery}
    expectedStatus: [planned]
    properties:
      - property: status
        value: dispatched
