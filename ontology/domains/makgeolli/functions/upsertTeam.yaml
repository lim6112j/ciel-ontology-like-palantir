functions:
  - apiName: upsertTeam
    displayName: 팀 등록/수정
    description: 팀번호로 업무 팀을 신규 등록하거나 기존 정보를 갱신한다.
    kind: write
    implementation: ontology_runtime.domains.makgeolli.functions.write.master_data.upsert_team
    parameters:
      teamNo:
        apiName: teamNo
        type: string
        required: true
      name:
        apiName: name
        type: string
        required: true
      kind:
        apiName: kind
        type: string
        required: true
      since:
        apiName: since
        type: string
        required: false
