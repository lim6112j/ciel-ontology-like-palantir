apiName: WasteBatch
displayName: 배치 폐기
description: 배치를 전부 또는 일부 폐기하고 폐기기록을 남긴다.
agentProposable: true
allowedRoles: [manager, brewer, agent]
parameters:
  batch:
    apiName: batch
    type: objectRef
    objectType: Batch
    displayName: 배치
  reason:
    apiName: reason
    type: enum
    values: [quality, expiry, damage, other]
    displayName: 사유
  quantity:
    apiName: quantity
    type: integer
    displayName: 폐기수량(병)
    required: false
  wastedOn:
    apiName: wastedOn
    type: date
    displayName: 폐기일
    required: false
rules:
  - type: runFunction
    function: wasteBatch
