apiName: AdjustWarehouseStock
displayName: 창고 재고 조정
description: 재고 실사 차이 등으로 창고 재고를 수동 조정한다. 에이전트가 제안할 수 없다.
agentProposable: false
allowedRoles: [manager]
parameters:
  stock:
    apiName: stock
    type: objectRef
    objectType: WarehouseStock
    displayName: 재고
  delta:
    apiName: delta
    type: integer
    displayName: 조정량
validators:
  - field: delta
    rule: range
    value: {min: -100000, max: 100000}
rules:
  - type: runFunction
    function: adjustWarehouseStock
