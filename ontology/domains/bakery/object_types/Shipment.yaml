apiName: Shipment
displayName: 배치출하
pluralDisplayName: 배치출하
description: 구운 배치를 매장으로 보내는 출하 단위. 출하 시점에 매장 재고가 반영된다.
primaryKey: shipmentNo
properties:
  shipmentNo:
    apiName: shipmentNo
    displayName: 출하번호
    type: string
    required: true
    unique: true
    maxLength: 32
  shipDate:
    apiName: shipDate
    displayName: 출하일
    type: date
    required: true
    indexed: true
  batchRid:
    apiName: batchRid
    displayName: 배치
    type: objectRef
    objectType: Batch
    required: true
    indexed: true
  storeRid:
    apiName: storeRid
    displayName: 매장
    type: objectRef
    objectType: Store
    required: true
    indexed: true
  quantity:
    apiName: quantity
    displayName: 출하수량
    type: integer
    required: true
    min: 1
  status:
    apiName: status
    displayName: 상태
    type: enum
    values: [prepared, in_transit, delivered, cancelled]
    required: true
    indexed: true
    defaultValue: prepared
  deliveredOn:
    apiName: deliveredOn
    displayName: 입고일
    type: date
stateMachine:
  property: status
  initial: prepared
  transitions:
    - from: prepared
      to: in_transit
    - from: in_transit
      to: delivered
    - from: prepared
      to: cancelled
    - from: in_transit
      to: cancelled
