apiName: CloseStore
displayName: 매장 휴업
description: 운영 중인 매장을 휴업 상태로 전환한다.
agentProposable: true
allowedRoles: [manager, agent]
parameters:
  store:
    apiName: store
    type: objectRef
    objectType: Store
    displayName: 매장
rules:
  - type: modifyObject
    target: {param: store, objectType: Store}
    expectedStatus: [active]
    properties:
      - property: status
        value: closed
