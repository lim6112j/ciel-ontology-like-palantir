services:
  db:
    image: postgres:16
    container_name: ontology-db
    environment:
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ontology
      POSTGRES_DB: ontology
    ports:
      - "55432:5432"
    volumes:
      - ontology-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ontology-pgdata:
